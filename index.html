<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveKeep - Dein Fahrzeug-Companion</title>
    <style>
        :root {
            --primary-color: #007AFF; /* Hellblau */
            --bg-color: #ffffff;
            --text-color: #1d1d1f;
            --secondary-text: #86868b;
            --light-gray: #f5f5f7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 4rem 2rem;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            letter-spacing: -1px;
        }
        p {
            font-size: 1.3rem;
            line-height: 1.6;
            color: var(--secondary-text);
            margin-bottom: 3rem;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .btn:hover {
            background-color: #005ecb;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
        }
        footer {
            position: fixed;
            bottom: 20px;
            font-size: 0.9rem;
            color: #86868b;
        }
        a { color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="container">
        <h1>DriveKeep</h1>
        <p>Dein zuverlässiger Companion für dein Fahrzeug. Einfach, intuitiv und sicher.</p>
        <div style="margin-bottom: 3rem;">
            <p><small>Aktueller Status: In Entwicklung</small></p>
        </div>
        <a href="privacy.html" class="btn">Datenschutzrichtlinie</a>
    </div>
    <footer>
        &copy; 2024 Apparise Studio. Alle Rechte vorbehalten.
    </footer>
</body>
</html>
